name: Apply response formatting fix

on:
  push:
    paths:
      - .github/workflows/apply-response-format-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch AI formatting instructions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          worker = Path('src/github-worker.js')
          text = worker.read_text(encoding='utf-8')

          old = "Return exactly one JSON object and no markdown.\n\nNormal response:"
          new = """Return exactly one JSON object. The message field may use the limited formatting syntax below.

Response presentation rules:
- Every normal text response must emphasize 1 to 3 genuinely important phrases using **double asterisks**.
- The client converts those markers into real bold text, so the user must never see the asterisks.
- Keep paragraphs short and visually ordered. Use short headings or lists only when they improve clarity.
- Do not bold whole paragraphs. Bold only conclusions, important actions, warnings, file names, statuses, or key values.
- Put multi-line code inside fenced code blocks and short identifiers inside inline code.

Normal response:"""

          if old not in text:
              raise SystemExit('Formatting instruction marker was not found')

          worker.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/apply-response-format-fix.yml').unlink()
          PY

      - name: Verify JavaScript syntax
        run: node --check src/ai-chat-client.js

      - name: Commit the fix
        shell: bash
        run: |
          git config user.name "Vexa Build Fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Require real bold emphasis in AI responses"
          git push
